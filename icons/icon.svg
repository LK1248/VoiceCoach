<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="85%">
      <stop offset="0" stop-color="#7b74ff"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#2e2899"/>
    </radialGradient>
  </defs>
  <!-- full-bleed square so it also works as a maskable icon (content stays in the central 80%) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- sound waves -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.55">
    <path d="M330 196 a90 90 0 0 1 0 120" stroke-width="16"/>
    <path d="M364 162 a140 140 0 0 1 0 188" stroke-width="14" opacity="0.6"/>
  </g>
  <!-- treble clef, matching the purple clef in the app header -->
  <text x="222" y="356" text-anchor="middle" fill="#ffffff"
        font-family="'Segoe UI Symbol', 'Noto Music', 'Noto Sans Symbols 2', serif" font-size="300">𝄞</text>
</svg>
